#
# Dependency updates.
#
# Weekly and grouped on purpose. A daily stream of single bumps trains a
# reviewer to approve without reading, and every change here still needs an
# approving review from somebody other than its author. Security advisories
# arrive separately and immediately through GitHub's own alerts.
#
# Three ecosystems, because three things are pinned: npm packages by the
# lockfile, GitHub Actions by commit SHA, and container base images by digest.
# A pin nobody updates is a vulnerability with a date on it; this is what
# keeps the pins moving.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      production: { dependency-type: production }
      development: { dependency-type: development }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      # init, analyze and upload-sarif are three entry points of one action at
      # one version. Split across three pull requests they merge one at a time,
      # and in between the workflow runs mismatched halves of CodeQL.
      codeql:
        patterns: ['github/codeql-action*']
    ignore:
      # v4 is a wrapper over actions/attest and needs `artifact-metadata: write`,
      # which release.yml does not grant. The job only runs on a tag, so the bump
      # would pass every check and fail at the next release. Upgrade it by hand,
      # with the permission, not by an automatic pull request.
      - dependency-name: actions/attest-build-provenance
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # A new Node major changes the runtime underneath CI, which tests on the
      # version setup-node installs. Digest updates within the same major arrive
      # automatically; a major moves in one deliberate change across the image,
      # CI and the release workflow together.
      - dependency-name: node
        update-types: ['version-update:semver-major']
