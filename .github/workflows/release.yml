#
# Cut a release when a v* tag is pushed, and attest what was built.
#
# WHY KEYLESS, AND NOT A GPG-SIGNED TAG.
#
# A GPG key is one more secret to escrow, one more thing a successor can be
# missing, and one more way for a release to become unverifiable because
# somebody lost a laptop. This project's own governance names continuity as its
# largest risk; adding a private key that must survive the maintainer works
# directly against that.
#
# Sigstore keyless signing binds the artifact to the GitHub OIDC identity of
# this exact workflow run and commit. There is nothing to store, nothing to
# leak, and nothing to lose. Ratchet reaches the same conclusion by a different
# route — it publishes to npm with --provenance, which is the same machinery.
#
# WHAT IT PROVES, AND WHAT IT DOES NOT. Provenance answers "which workflow, at
# which commit, built this file". It does not answer "was that commit any
# good". A perfectly genuine attestation over a bad commit is still an
# attestation over a bad commit; the review requirement on `main` is what
# addresses that, not this file.

name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # what lets Sigstore issue a keyless certificate
      attestations: write    # record the provenance
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: crimp
          POSTGRES_PASSWORD: crimp
          POSTGRES_DB: crimp
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U crimp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with: { node-version: '24', cache: npm }
        # 24, as in CI and the image. Node 22 has no ML-DSA, so a release built
        # on it would skip the post-quantum tests the same commit passed in CI.

      - run: npm ci

      # Nothing ships untested. A release is the one artifact somebody might
      # run without reading, so the gate is the full suite rather than a subset.
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://crimp:crimp@localhost:5434/crimp
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgres://crimp:crimp@localhost:5434/crimp
      - name: Conformance vectors
        run: npm run conformance
      - name: Property-based tests
        run: npm run fuzz
        env: { FUZZ_RUNS: '20000' }
      - name: Production dependency audit
        run: npm run audit

      # The tag must name the version in package.json. A release labelled
      # v0.2.0 containing 0.1.0 is a lie that is very hard to notice later.
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json $pkg"

      - name: Build the source archive
        run: |
          name="crimp-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz --prefix="crimp-${GITHUB_REF_NAME}/" \
            -o "$name" "$GITHUB_REF_NAME"
          sha256sum "$name" | tee "$name.sha256"
          echo "ARCHIVE=$name" >> "$GITHUB_ENV"

      - name: Attest what was built
        id: attest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-path: ${{ env.ARCHIVE }}

      # The attestation also lives in GitHub's attestation store, but a verifier
      # without GitHub, and OpenSSF Scorecard, look for it beside the release.
      # The Sigstore bundle is the signature; the DSSE envelope inside it, one
      # per line, is the in-toto provenance.
      - name: Attach the signature and provenance to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$ARCHIVE.sigstore.json"
          jq -c '.dsseEnvelope' "$BUNDLE" > "$ARCHIVE.intoto.jsonl"
          test -s "$ARCHIVE.intoto.jsonl" && grep -q payloadType "$ARCHIVE.intoto.jsonl"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file - "$ARCHIVE" "$ARCHIVE.sha256" "$ARCHIVE.sigstore.json" "$ARCHIVE.intoto.jsonl" <<NOTES

          ## Verifying this release

          The archive carries a Sigstore attestation bound to the workflow run
          and commit that produced it. There is no signing key, so there is
          none to lose or leak.

          \`\`\`
          gh attestation verify $ARCHIVE --repo $GITHUB_REPOSITORY
          \`\`\`

          Or offline, against the bundle attached here:

          \`\`\`
          gh attestation verify $ARCHIVE --bundle $ARCHIVE.sigstore.json --repo $GITHUB_REPOSITORY
          \`\`\`

          That answers *which workflow, at which commit, built this file*. It
          does not answer whether that commit was any good — every commit on
          \`main\` requires review by somebody other than its author, and that
          is what addresses the second question.
          NOTES
