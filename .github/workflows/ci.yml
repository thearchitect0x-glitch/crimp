name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Typecheck (src, test, scripts)
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Property-based tests
        run: npm run fuzz
        env: { FUZZ_RUNS: '20000' }
      - name: Production dependency audit
        run: npm run audit

  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Every commit is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          range="${base:+$base..HEAD}"; range="${range:-HEAD~1..HEAD}"
          fail=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $sha is missing Signed-off-by (use git commit -s)"; fail=1
            fi
          done < <(git rev-list "$range")
          exit $fail
