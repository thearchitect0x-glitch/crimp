name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crimp
          POSTGRES_PASSWORD: crimp
          POSTGRES_DB: crimp
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U crimp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Typecheck (src, test, scripts)
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Migrations apply to an empty database
        run: npm run migrate
        env:
          DATABASE_URL: postgres://crimp:crimp@localhost:5434/crimp
      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://crimp:crimp@localhost:5434/crimp
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgres://crimp:crimp@localhost:5434/crimp
      - name: Property-based tests
        run: npm run fuzz
        env: { FUZZ_RUNS: '20000' }
      - name: Production dependency audit
        run: npm run audit

  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Every commit is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          range="${base:+$base..HEAD}"; range="${range:-HEAD~1..HEAD}"
          fail=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::commit $sha is missing Signed-off-by (use git commit -s)"; fail=1
            fi
          done < <(git rev-list "$range")
          exit $fail
