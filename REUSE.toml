version = 1
SPDX-PackageName = "crimp"
SPDX-PackageSupplier = "Deimos AI LLC <security@crimpgate.com>"
SPDX-PackageDownloadLocation = "https://github.com/thearchitect0x-glitch/crimp"

# Bulk licensing declarations, for files that cannot carry a comment header or
# where one would be noise.
#
# Source files carry their own header — see any file under src/, test/ or
# scripts/. This covers the rest: prose and config, where a two-line legal
# preamble above the first heading of every document is clutter, and JSON,
# which has no comment syntax to put one in.
#
# Everything declared here is Deimos AI LLC's own work under the same licence
# as the code. Nothing third-party is relicensed by these declarations.

[[annotations]]
path = ["**.md", "**.html", "**.svg", "**.png"]
SPDX-FileCopyrightText = "2026 Deimos AI LLC"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["**.json", "**.yml", "**.yaml", "**.toml", "**.txt", ".gitignore", ".env.example"]
SPDX-FileCopyrightText = "2026 Deimos AI LLC"
SPDX-License-Identifier = "Apache-2.0"
